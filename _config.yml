title: Zork Network™ Documentation
description: Explore Your Money. Developer documentation for the Zork Network™ — the system behind Zorkcoin (ZORK).
remote_theme: carlosperate/jekyll-theme-rtd@main

# Plugins
#lugins:
# - jekyll-remote-theme

# Canonical URL — required for Open Graph / Twitter Card absolute URLs. For local
# `jekyll serve`, override: bundle exec jekyll serve --config _config.yml,_config_local.yml
url: "https://docs.zork.network"
baseurl: ""

# Social / link previews (see _includes/social-meta.html). Optional: twitter_site: "@handle"
social:
  default_image: /assets/img/og-default.jpg
  image_alt: "Zork Network Documentation — Explore Your Money."

# Development server config, needed to load some of the content
#webrick:
#  headers:
#    Access-Control-Allow-Origin: "*"

# Theme settings
site_author: Zork Network™ Developers
repo_url: 'https://github.com/ZorkNetwork/docs.zork.network'
edit_on_github: true
github_docs_folder: false
sticky_navigation: true
prev_next_buttons_location: both
search_enabled: true
hljs_style: github-gist
google_analytics: G-FZN9KEJR6Y

# Locale folders: sets page.lang for translated trees (GitHub Pages–friendly static paths).
defaults:
