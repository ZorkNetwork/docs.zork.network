title: Zork Network™ Documenation
description: Developer documentation for the Zork Network™.
remote_theme: carlosperate/jekyll-theme-rtd@main

# Plugins
#lugins:
# - jekyll-remote-theme

# Local development URLs (override in production if needed)
# Use localhost so links work correctly when running inside a container.
#url: "http://localhost:4000"
#baseurl: ""

# Development server config, needed to load some of the content
#webrick:
#  headers:
#    Access-Control-Allow-Origin: "*"

# Theme settings
site_author: Zork Network™ Developers
repo_url: 'https://github.com/ZorkNetwork/docs.zork.network'
edit_on_github: true
github_docs_folder: false
sticky_navigation: true
prev_next_buttons_location: both
search_enabled: true
hljs_style: github-gist
google_analytics: G-FZN9KEJR6Y

# Locale folders: sets page.lang for translated trees (GitHub Pages–friendly static paths).
defaults:
